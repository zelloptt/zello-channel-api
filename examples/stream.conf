# Configuration for Zello Streaming API Example
# In order to generate an auth token follow:
# https://github.com/zelloptt/zello-channel-api/blob/master/AUTH.md

[zello]
# Zello Work only: set your network name to connect to wss://zellowork.io/ws/<network>.
# Leave it unset (or remove it) to connect to Zello Consumer (zello.io).
# network = zello_work_network
username = zello_username
password = zello_password
channel = zello_channel
# Required for Zello Consumer, optional for Zello Work
token = zello_auth_token

[media]
filename = sample.opus
